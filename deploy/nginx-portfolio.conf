# Static portfolio served by nginx. Copy to /etc/nginx/sites-available/portfolio,
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d portfolio.openforge.online
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.openforge.online;

    root /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
